apiVersion: v1
kind: Namespace
metadata:
  name: preview-system
---
# One wildcard cert for all previews (avoids Let's Encrypt rate limits per PR).
# Reflector copies the resulting Secret into every namespace matching pr-<N>.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: preview-wildcard
  namespace: preview-system
spec:
  secretName: preview-wildcard-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - "*.preview.REPLACE_ME_example.com"
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "pr-[0-9]+"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "pr-[0-9]+"
