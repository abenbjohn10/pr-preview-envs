apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_ME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-dns01-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: REPLACE_ME_HOSTED_ZONE_ID   # credentials come from the IRSA service account
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns01-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACE_ME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-dns01-staging-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: REPLACE_ME_HOSTED_ZONE_ID
