name: Preview Janitor

# Nightly safety net: delete preview namespaces whose PR is closed or that
# outlived MAX_AGE_DAYS (missed `closed` events, cancelled runs, etc).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: read

concurrency:
  group: preview-janitor
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run janitor
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          MAX_AGE_DAYS: ${{ vars.PREVIEW_MAX_AGE_DAYS || '7' }}
        run: bash scripts/janitor.sh
